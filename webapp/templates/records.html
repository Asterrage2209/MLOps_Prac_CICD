<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Prediction Records</h1>
    <table>
            <tr>
                <th>ID</th>
                <th>Septal Length</th>
                <th>Septal Width</th>
                <th>Petal Length</th>
                <th>Petal Width</th>
                <th>Prediction</th>
            </tr>
            {% for record in records %}
            <tr>
                <td>{{ record.id }}</td>
                <td>{{ record.sepal_length }}</td>
                <td>{{ record.sepal_width }}</td>
                <td>{{ record.petal_length }}</td>
                <td>{{ record.petal_width }}</td>
                <td>{{ record.prediction }}</td>
            </tr>
            {% endfor %}
    </table>
    <p><a href="/">Wanna predict again ?</a></p>
</body>
</html>
